<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat en Tiempo Real</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .chat-container {
            width: 500px;
            max-width: 95%;
            background: #16213e;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .chat-header {
            color: #fff;
            text-align: center;
            padding: 10px;
            font-size: 20px;
            border-bottom: 1px solid #0f3460;
        }
        .chat-messages {
            height: 400px;
            overflow-y: auto;
            padding: 15px;
            margin: 15px 0;
            background: #0f3460;
            border-radius: 10px;
        }
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: #533483;
            border-radius: 10px;
        }
        .message {
            background: #1a1a2e;
            color: #fff;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            word-wrap: break-word;
        }
        .message.system {
            background: #533483;
            text-align: center;
            font-style: italic;
            font-size: 14px;
        }
        .chat-input {
            display: flex;
            gap: 10px;
        }
        .chat-input input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #0f3460;
            color: #fff;
            font-size: 14px;
        }
        .chat-input input::placeholder {
            color: #aaa;
        }
        .chat-input button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #533483;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .chat-input button:hover {
            background: #6a4c9c;
        }
        .login-container {
            text-align: center;
        }
        .login-container input {
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #0f3460;
            color: #fff;
            font-size: 16px;
            width: 70%;
            margin-right: 10px;
        }
        .login-container button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #533483;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }
        .login-container button:hover {
            background: #6a4c9c;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <!-- PANTALLA DE LOGIN -->
    <div id="loginScreen" class="login-container">
        <h2 style="color: #fff; margin-bottom: 20px;">Chat</h2>
        <input type="text" id="nombreInput" placeholder="Ingresa tu nombre...">
        <button onclick="conectar()">Entrar</button>
    </div>

    <!-- PANTALLA DE CHAT -->
    <div id="chatScreen" class="hidden">
        <div class="chat-header">Chat en Tiempo Real</div>
        <div class="chat-messages" id="messages"></div>
        <div class="chat-input">
            <input type="text" id="messageInput" placeholder="Escribe un mensaje..." onkeypress="if(event.key==='Enter') enviarMensaje()">
            <button onclick="enviarMensaje()">Enviar</button>
        </div>
    </div>
</div>

<script>
    let ws = null;
    let nombre = '';

    function conectar() {
        nombre = document.getElementById('nombreInput').value.trim();
        if (!nombre) {
            alert('Ingresa un nombre');
            return;
        }

        ws = new WebSocket(`ws://${window.location.host}/ws`);

        ws.onopen = function() {
            ws.send(nombre);
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('chatScreen').classList.remove('hidden');
            document.getElementById('messageInput').focus();
        };

        ws.onmessage = function(event) {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'message';
            
            if (event.data.startsWith('+') || event.data.startsWith('-')) {
                div.className = 'message system';
            }
            
            div.textContent = event.data;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        };

        ws.onclose = function() {
            alert('Desconectado del servidor');
            window.location.reload();
        };
    }

    function enviarMensaje() {
        const input = document.getElementById('messageInput');
        const mensaje = input.value.trim();
        if (!mensaje) return;

        ws.send(mensaje);
        input.value = '';
        input.focus();
    }
</script>

</body>
</html>
